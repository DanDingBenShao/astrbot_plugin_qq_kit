name: astrbot_plugin_qq_kit
display_name: 本少的qq机器人功能包
short_desc: 套件门面——探测本少系组件插件，/qqkit 聚合状态页
desc: |
  本少的 QQ 机器人功能包（套件门面）。

  套件主框架的壳：自动探测本机已装的本少系组件插件（如
  astrbot_plugin_qqmind），/qqkit 输出组件安装/启停/版本聚合状态页。
  组件可散装单装，也可全家桶聚合使用；门面自身不做业务逻辑。

  使用方式：发送 `/qqkit` 查看套件组件状态。
version: 0.2.0
author: DanDingBenShao
repo: https://github.com/DanDingBenShao/astrbot_plugin_qq_kit
astrbot_version: ">=4.29.0"
support_platforms:
